<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestione impresa pulizie</title>
<link rel="icon" type="image/png" href="dipendenti/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: binario di navigazione a sinistra con due gruppi (Operatività, Contabilità), barra a schede in alto su telefono. Look da registro di cantiere: carta minerale, inchiostro, verde detergente, giallo segnaletica solo per "oggi". */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#142326; --muted:#566769; --line:#D2DBD9;
  --accent:#0B6E67; --accent-ink:#FFFFFF; --accent-soft:#D6ECE9; --signal:#E9B824;
  --ok:#2E7D4F; --ok-soft:#DDF0E3; --warn:#9A6514; --warn-soft:#F7EBD3; --bad:#B23A3A; --bad-soft:#F6DEDE;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162124; --sunk:#111B1D; --ink:#E2EBE9; --muted:#93A4A5; --line:#273739;
  --accent:#3FB4A9; --accent-ink:#06201D; --accent-soft:#163A37; --signal:#F0C94F;
  --ok:#5BC489; --ok-soft:#173326; --warn:#E1AA4F; --warn-soft:#3A2C12; --bad:#EC7B7B; --bad-soft:#3D1D1D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162124; --sunk:#111B1D; --ink:#E2EBE9; --muted:#93A4A5; --line:#273739;
  --accent:#3FB4A9; --accent-ink:#06201D; --accent-soft:#163A37; --signal:#F0C94F;
  --ok:#5BC489; --ok-soft:#173326; --warn:#E1AA4F; --warn-soft:#3A2C12; --bad:#EC7B7B; --bad-soft:#3D1D1D; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav .grp:first-child{padding-top:0}
.nav button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto;scrollbar-width:none}
.subnav button{all:unset;cursor:pointer;padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav button:hover{color:var(--ink)}
.subnav button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.subnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:10px;padding:0 6px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
main{padding-block:24px 64px;padding-left:max(16px,min(32px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1240px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-size:30px;font-weight:700}
.head .sub{color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:disabled{opacity:.5;cursor:default}
select.btn,input.btn{padding:6px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:17px;font-weight:700}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel .ph>*{min-width:0;max-width:100%}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--f-display);font-stretch:80%;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi .n{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.r{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-family:var(--f-mono);font-size:13px;min-width:48px;padding-top:1px}
.row .b{flex:1;min-width:0}
.row .b b{font-weight:600}
.row .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.alert{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.alert:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.day.today{border-color:var(--signal);box-shadow:inset 0 3px 0 var(--signal)}
.day .dh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day .dh b{font-family:var(--f-display);font-stretch:80%;font-size:15px}
.day .dh span{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.day .slots{padding:6px;display:flex;flex-direction:column;gap:6px}
.occ{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.occ.done{border-color:var(--ok);background:var(--ok-soft)}
.occ.skip{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.occ.conf{box-shadow:inset 3px 0 0 var(--warn)}
.occ .h{display:flex;justify-content:space-between;gap:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.occ .s{font-weight:600;font-size:12.5px;overflow-wrap:anywhere}
.occ .o{color:var(--muted);overflow-wrap:anywhere}
.occ .a{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.occ .a button{all:unset;cursor:pointer;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.occ .a button:focus-visible{outline:2px solid var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface)}
.empty h2{font-size:20px}
.empty p{margin:0;max-width:60ch;color:var(--muted)}
.client{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.client:first-of-type{border-top:0;padding-top:0}
.client .ch{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.client .ch b{font-family:var(--f-display);font-stretch:85%;font-size:17px;cursor:pointer}
.client .ch b:hover{color:var(--accent)}
.note{font-size:12px;color:var(--muted);max-width:80ch;margin:0}
.note b{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-weight:500;color:var(--muted);white-space:nowrap;flex-shrink:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.saldi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.saldo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.saldo[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.saldo .v{font-family:var(--f-display);font-stretch:80%;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
/* modale */
.scrim{position:fixed;inset:0;background:rgba(8,16,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);display:flex;flex-direction:column}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .mh h2{font-size:19px}
.modal .mb{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full,.full{grid-column:1/-1}
.fld label,.fld .lb{font-size:12px;font-weight:600}
.fld .hint{font-size:11px;color:var(--muted)}
.fld input,.fld select,.fld textarea,.rg input,.rg select,.al input{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg);width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-weight:500;cursor:pointer;background:var(--bg)}
.chips input{width:auto;margin:0;accent-color:var(--accent)}
.calc{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.calc div{display:flex;flex-direction:column;gap:2px}
.calc .big{font-family:var(--f-display);font-stretch:80%;font-size:24px;font-weight:700;color:var(--accent)}
.calc .v{font-family:var(--f-mono);font-size:13px}
.rows{display:flex;flex-direction:column;gap:6px}
.rg{display:grid;grid-template-columns:minmax(0,1fr) 58px 96px minmax(120px,200px) 30px;gap:6px;align-items:center}
.rg.sc{grid-template-columns:150px 120px minmax(0,1fr) 30px}
.rg.hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rg .x{all:unset;cursor:pointer;text-align:center;color:var(--muted);font-size:16px}
.rg .x:focus-visible{outline:2px solid var(--accent)}
.tot{display:grid;grid-template-columns:auto auto;justify-content:end;gap:2px 18px;font-family:var(--f-mono);font-size:13px;margin-top:4px}
.tot span:nth-child(odd){color:var(--muted);text-align:right;font-family:var(--f-body)}
.tot span:nth-child(even){text-align:right}
.tot .grand{font-weight:600;color:var(--ink)}
.alloc{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.al{display:grid;grid-template-columns:22px minmax(0,1fr) auto 110px;gap:8px;align-items:center;font-size:13px}
.al input[type=checkbox]{width:auto;accent-color:var(--accent)}
.withadd{display:flex;gap:6px;align-items:stretch;min-width:0}
.withadd select{flex:1;min-width:0}
.addbtn{border-style:dashed;color:var(--accent);font-weight:600}
.chips .addbtn{border-radius:14px}
table.est tr.ph-row td{background:var(--sunk);border-top:2px solid var(--line)}
table.est tr.sub td:nth-child(2){padding-left:24px;position:relative}
table.est tr.sub td:nth-child(2)::before{content:"";position:absolute;left:10px;top:0;bottom:50%;width:8px;border-left:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.6}
table.est tr.pf-row td{border-bottom:1px solid var(--line);padding-bottom:12px}
table.est tr.click:hover td{background:var(--accent-soft)}
.occ.unc{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
s.neg{text-decoration-thickness:1.5px}
table.agrid td,table.agrid th{white-space:nowrap}
table.agrid .tday{background:color-mix(in srgb,var(--signal) 14%,transparent)}
.aday{border-top:1px solid var(--line);padding-top:8px}
.aday:first-of-type{border-top:0;padding-top:0}
.aday.today .adh b{box-shadow:inset 0 -3px 0 var(--signal)}
.adh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.adh b{font-family:var(--f-display);font-stretch:85%;font-size:15px}
.pill.click{cursor:pointer}
.occ.live{border-color:var(--ok)}
.tl{margin-top:3px}
.authbox{max-width:440px;margin:6vh auto 0;width:100%}
.authbox h1{font-size:30px}
.authbox .fld input{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--bg);width:100%}
.authbox form{display:flex;flex-direction:column;gap:12px}
.ok-msg{color:var(--ok);font-size:13px}
.wz input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--bg);width:110px;text-align:right;font-family:var(--f-mono)}
.wz input[type=number]:disabled{opacity:.4}
.wz input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.wz select,.wz input[type=date],.wz #wz_descr{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--bg);width:100%}
table.altab td{padding:6px 6px;vertical-align:middle}
table.altab tr.grp td{background:var(--sunk);border-top:2px solid var(--line)}
table.altab tr:not(.grp) td:nth-child(2){padding-left:18px}
table.altab input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surface);width:110px;text-align:right;font-family:var(--f-mono)}
table.altab input[type=number]:disabled{opacity:.4}
table.altab input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
pre.copy{white-space:pre-wrap;background:var(--sunk);padding:12px;border-radius:6px;font-family:var(--f-mono);font-size:12px;margin:0;overflow-wrap:anywhere}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;overflow:visible;z-index:20;border-right:0;border-bottom:1px solid var(--line);padding-block:10px 0;padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand{flex-direction:row;align-items:baseline;gap:8px}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
  .nav .grp{display:none}
  .nav button{white-space:nowrap;padding:8px 10px}
  .rail .foot{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .week{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .rg.sc{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px}
  .rg.sc>:first-child{grid-column:auto}
  .rg.sc span{display:none}
  .modal .mb{grid-template-columns:minmax(0,1fr)}
  .calc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .head h1{font-size:25px}
  .rg{grid-template-columns:72px minmax(0,1fr) 30px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
  .rg>:first-child{grid-column:1/-1}
  .rg select{grid-column:1/3;grid-row:3}
  .rg .x{grid-column:3;grid-row:3}
  .rg.hd{display:none}
  .al{grid-template-columns:22px minmax(0,1fr) 96px}
  .al .res{grid-column:2}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav button{transition:background .12s,border-color .12s}}

  const NOMI={sedi:"sedi",fatture:"fatture",acquisti:"fatture d'acquisto",movimenti:"movimenti di prima nota",clienti:"clienti",fornitori:"fornitori",pagamenti:"tipi di pagamento",preventivi:"preventivi",straordinari:"interventi straordinari",ispezioni:"ispezioni",assenze:"assenze",abbinamenti:"abbinamenti"};
  if(c==="23503"){ const t=(d.match(/table "([^"]+)"/)||m.match(/constraint "[^"]+" on table "([^"]+)"/)||[])[1];
    if(/still referenced|update or delete/i.test(m+d))return `Non si può eliminare: è ancora usato in ${NOMI[t]||t||"altri dati"}. Elimina o modifica prima quelli.`;
    return "Il record fa riferimento a un dato che non esiste più (cliente, sede, conto o tipo di pagamento). Ricarica la pagina e riprova." }
  if(c==="23505")return /fatture_tipo_numero/.test(m)?"Esiste già un documento con questo numero.":/email_app/.test(m)?"Questa email è già usata da un altro dipendente.":"Esiste già un record con questi dati.";
  if(c==="23514"||c==="22P02"||c==="22007"||c==="22008")return "Dato non valido: controlla date, orari e numeri. ("+m+")";
  if(c==="PGRST202"||c==="42883"||/salva_lotto/.test(m)&&/not find|does not exist/i.test(m))return "Il database non è aggiornato: esegui in Supabase lo script schema_v2.sql.";
  return errMsg(e);
}
async function salvaOps(ops){ const {error}=await sb.rpc("salva_lotto",{p_ops:ops}); if(error)throw error; }
async function save(c,obj){
  const o=JSON.parse(JSON.stringify(obj)); if(!o.id)o.id=rid()+rid();
  try{ await salvaOps([opDB(c,o)]) } catch(e){ toast(erroreDB(e)); return false }
  const loc=roundTrip(c,o);
  const i=S[c].findIndex(x=>x.id===o.id); if(i>=0)S[c][i]=loc; else S[c].push(loc);
  ver++; render(); schedulePublish(); return o.id;
}
async function del(c,id){
  try{
    if(c==="timbrature"){const {error}=await sb.from("timbrature").delete().eq("id",id); if(error)throw error}
    else await salvaOps([{tab:c==="liste"?(id==="azienda"?"azienda":"elenchi"):DBS[c].t,elimina:id}]);
  }catch(e){ toast(erroreDB(e)); const fe=$("#ferr"); if(fe)fe.textContent=erroreDB(e); return false }
  if(c==="timbrature")T=T.filter(x=>x.id!==id); else S[c]=S[c].filter(x=>x.id!==id);
  if(DEL_RELOAD[c]){ try{ const r=await caricaDB(DEL_RELOAD[c]); Object.assign(S,r) }catch(e){} }
  ver++; render(); schedulePublish(); return true;
}
// salva molti record in pochi lotti; se un lotto fallisce riprova un record alla volta e raccoglie gli errori
async function salvaMolti(items,onProg){
  const errori=[]; let fatti=0;
  for(let i=0;i<items.length;i+=150){
    const part=items.slice(i,i+150);
    try{ await salvaOps(part.map(x=>opDB(x.c,x.o))); fatti+=part.length }
    catch(e){ for(const x of part){ try{ await salvaOps([opDB(x.c,x.o)]); fatti++ }catch(e2){ errori.push(`${x.c} ${x.o.id}: ${erroreDB(e2)}`) } } }
    if(onProg)onProg(Math.min(i+150,items.length),items.length);
  }
  return {fatti,errori};
}

  const operatore=(id)=>{ if(!idsDi("operatori").has(id))nuovo("operatori",{id,nome:"Dipendente "+id+" (recuperato)",attivo:false,note:NOTA},`Assenze di un dipendente eliminato: conservate sotto "Dipendente ${id} (recuperato)", non attivo.`); return id };
  const sede=(id)=>{ if(!idsDi("sedi").has(id)){ const cid=cliente("_sedi_eliminate","Sedi eliminate"); nuovo("sedi",{id,clienteId:cid,nome:"Sede "+id+" (recuperata)",attiva:false,giorni:[],operatori:[],note:NOTA},`Turni o ispezioni di una sede eliminata (${id}): conservati sotto la sede sospesa "Sede ${id} (recuperata)".`) } return id };
  const conto=(id)=>{ if(!idsDi("conti").has(id))nuovo("conti",{id,nome:"Conto "+id,saldoIniziale:0},`Movimenti sul conto "${id}", che non esisteva più: creato il conto "Conto ${id}" con saldo iniziale 0. Controllalo in Prima nota.`); return id };
  const opt=(c,o,k,col,cosa)=>{ if(o[k]&&!idsDi(col).has(String(o[k]))){note.push(`${cosa} ${o.id}: ${k==="pagamento"?"tipo di pagamento":k} "${o[k]}" non esiste più, lasciato vuoto.`); o[k]=""} };
  const ops=(o,cosa)=>{ if(!Array.isArray(o.operatori))return; const ok=o.operatori.filter(x=>idsDi("operatori").has(String(x))); const n=o.operatori.length-ok.length; if(n)note.push(`${cosa}: ${n===1?"tolto dalla squadra un dipendente eliminato":`tolti dalla squadra ${n} dipendenti eliminati`}.`); o.operatori=ok };
  const data=(o,k,cosa,def)=>{ if(!dateDB(o[k])){ const v=def||TODAY(); note.push(`${cosa} ${o.id}: data "${o[k]||""}" non valida, impostata al ${dShort(v)}.`); o[k]=v } };
  const allocOk=(o,cosa)=>{ if(!Array.isArray(o.alloc))return; const ok=o.alloc.filter(a=>{const s=String(a&&a.doc||""); return s.startsWith("v:")?idsDi("fatture").has(s.slice(2)):s.startsWith("a:")?idsDi("acquisti").has(s.slice(2)):false});
    const n=o.alloc.length-ok.length; if(n)note.push(`${cosa}: ${n===1?"tolto un abbinamento":`tolti ${n} abbinamenti`} a documenti che non esistono più; la somma torna da abbinare.`); o.alloc=ok };
  dati.pagamenti.forEach(o=>{ if(!o.descrizione)o.descrizione="Pagamento "+o.id; opt("pagamenti",o,"conto","conti","Tipo di pagamento"); if(o.base&&!["DF","FM"].includes(o.base))o.base="DF"; if(o.giornoFisso&&!(+o.giornoFisso>=1&&+o.giornoFisso<=31))o.giornoFisso="" });

  dati.clienti.forEach(o=>{ if(!o.nome)o.nome="Cliente "+o.id; opt("clienti",o,"amministratoreId","amministratori","Cliente"); opt("clienti",o,"pagamento","pagamenti","Cliente") });
  dati.fornitori.forEach(o=>{ if(!o.nome)o.nome="Fornitore "+o.id; opt("fornitori",o,"pagamento","pagamenti","Fornitore") });
  const email=new Set((base.operatori||[]).filter(x=>!dati.operatori.some(y=>y.id===x.id)).map(x=>String(x.emailApp||"").toLowerCase()).filter(Boolean));
  dati.operatori.forEach(o=>{ if(!o.nome)o.nome="Dipendente "+o.id; const e=String(o.emailApp||"").trim().toLowerCase(); if(e){ if(email.has(e)){note.push(`${o.nome}: l'email per l'app ${e} è già di un altro dipendente, tolta.`); o.emailApp=""} else {email.add(e); o.emailApp=e} } });
  dati.sedi.slice().forEach(o=>{ if(!o.nome)o.nome="Sede "+o.id; if(!o.clienteId||!idsDi("clienti").has(String(o.clienteId))){o.clienteId=cliente(String(o.clienteId||"_sedi_eliminate"),o.clienteId?null:"Sedi eliminate")} ops(o,"Sede "+o.nome); if(o.ora&&!/^\d{1,2}:\d{2}$/.test(o.ora)){note.push(`Sede ${o.nome}: orario "${o.ora}" non valido, lasciato vuoto.`);o.ora=""} });

  dati.straordinari.forEach(o=>{ sede(String(o.sedeId)); data(o,"data","Intervento straordinario"); ops(o,"Intervento straordinario del "+dShort(o.data)) });
  dati.assenze.forEach(o=>{ operatore(String(o.operatoreId||"senza_codice")); o.operatoreId=String(o.operatoreId||"senza_codice"); data(o,"dal","Assenza"); if(o.al&&dateDB(o.al)&&o.al<o.dal){note.push(`Assenza dal ${dShort(o.dal)}: la data di fine era precedente all'inizio, impostata uguale all'inizio.`);o.al=o.dal} });
  dati.ispezioni.forEach(o=>{ sede(String(o.sedeId)); data(o,"data","Ispezione") });
  dati.preventivi.forEach(o=>{ opt("preventivi",o,"clienteId","clienti","Preventivo") });
  const numeri=new Set((base.fatture||[]).filter(x=>!dati.fatture.some(y=>y.id===x.id)).map(x=>(x.tipo==="nc"?"nc":"f")+"|"+x.numero));
  dati.fatture.sort((a,b)=>(a.tipo==="nc")-(b.tipo==="nc"));
  dati.fatture.forEach(o=>{ const cosa=o.tipo==="nc"?"Nota di credito":"Fattura"; if(o.tipo!=="nc")o.tipo="fattura";
    if(!o.clienteId||!idsDi("clienti").has(String(o.clienteId)))o.clienteId=cliente(String(o.clienteId||"senza_codice"),o.clienteNome);
    if(!o.numero)o.numero="SN-"+o.id; data(o,"data",cosa+" "+o.numero);
    let k=(o.tipo==="nc"?"nc":"f")+"|"+o.numero; if(numeri.has(k)){ let n=2; while(numeri.has(k+" ("+n+")"))n++; note.push(`${cosa} ${o.numero} del ${dShort(o.data)}: numero già usato da un altro documento, rinominata "${o.numero} (${n})". Controllala.`); o.numero=o.numero+" ("+n+")"; k=(o.tipo==="nc"?"nc":"f")+"|"+o.numero } numeri.add(k);
    opt("fatture",o,"pagamento","pagamenti",cosa+" "+o.numero);
    if(Array.isArray(o.preventivi))o.preventivi=o.preventivi.filter(x=>idsDi("preventivi").has(String(x)));
    allocOk(o,cosa+" "+o.numero) });
  dati.acquisti.forEach(o=>{ if(!o.fornitoreId||!idsDi("fornitori").has(String(o.fornitoreId)))o.fornitoreId=fornitore(String(o.fornitoreId||"senza_codice")); if(!o.numero)o.numero="SN-"+o.id; data(o,"data","Fattura d'acquisto "+o.numero); opt("acquisti",o,"pagamento","pagamenti","Fattura d'acquisto "+o.numero) });
  dati.movimenti.forEach(o=>{ const cosa="Movimento del "+dShort(o.data)+(o.descrizione?` (${o.descrizione})`:"");
    if(!["entrata","uscita","giroconto"].includes(o.tipo)){note.push(`${cosa}: tipo "${o.tipo||""}" non valido, considerato uscita.`);o.tipo="uscita"}
    data(o,"data","Movimento"); o.conto=conto(String(o.conto||"banca"));
    if(o.tipo==="giroconto"){ o.contoDest=conto(String(o.contoDest||(o.conto==="cassa"?"banca":"cassa"))); o.soggetto="" } else o.contoDest="";
    const s=String(o.soggetto||""); if(s.startsWith("c:"))cliente(s.slice(2)); else if(s.startsWith("f:"))fornitore(s.slice(2)); else o.soggetto="";
    if(numDB(o.importo)==null){note.push(`${cosa}: importo non valido, impostato a 0.`);o.importo=0}
    allocOk(o,cosa) });
  dati.cu=dati.cu.filter(o=>{ if(!o.clienteId)o.clienteId=o.id.split("_")[0]; if(!o.anno)o.anno=o.id.split("_").pop(); if(!idsDi("clienti").has(String(o.clienteId))){note.push(`Certificazione unica ${o.id}: il condominio non esiste più, non trasferita.`);return false} return true });
  const lc=dati.liste.find(x=>x.id==="codiciIva"); if(lc&&Array.isArray(lc.valori)){const v=new Set(); lc.valori=lc.valori.filter(x=>x&&x.id&&!v.has(x.id)&&v.add(x.id))}

async function trasferisci(D,base,onProg){

  const r=await salvaMolti(items,onProg);

}

async function leggiDocs(){
  const all=[];
  for(let from=0;;from+=1000){ const {data,error}=await sb.from("docs").select("col,id,data").order("col").order("id").range(from,from+999); if(error)throw error; all.push(...data); if(data.length<1000)break }

  return D;
}

async function eseguiMigrazione(){
  if(migra&&migra.inCorso)return;
  migra=Object.assign(migra||{},{inCorso:true,stato:"Lettura della vecchia tabella…"}); render();
  try{
    const D=await leggiDocs(); migra.conteggi={}; Object.entries(D).forEach(([k,v])=>migra.conteggi[k]=v.length);
    const base=await caricaDB();
    // ripetendo il trasferimento si aggiungono solo i record che mancano, senza toccare quelli già nelle nuove tabelle
    if(migra.soloMancanti)Object.keys(D).forEach(c=>{const ex=new Set((base[c]||[]).map(x=>x.id)); D[c]=D[c].filter(x=>!ex.has(String(x.id)))});
    const e=await trasferisci(D,base,(n,t)=>{const el=$("#migraStato"); if(el)el.textContent=`Trasferiti ${n} record su ${t}…`});
    await loadAll(); migra.esito=e; migra.inCorso=false; migra.stato="";
  }catch(err){ migra.inCorso=false; migra.stato=""; toast(erroreDB(err)); }
  render();
}

function costoSede(s){
  const ops=(s.operatori||[]).map(id=>byId("operatori",id)).filter(Boolean);

  const oreMese=(Number(s.durata)||0)*(s.giorni||[]).length*VISITE_MESE;
  return {oreMese, costo:oreMese*costoOra};
}
function marginePct(s){const r=Number(s.canone)||0; if(!r)return null; return (r-costoSede(s).costo)/r*100}
// assenza di un operatore in una data (e facoltativamente in una fascia oraria, in minuti)
function assenza(opId,data,a0,a1){
  return S.assenze.find(x=>x.operatoreId===opId&&x.dal<=data&&data<=(x.al||x.dal)&&(!(x.dalle&&x.alle)||a0==null||(mins(x.dalle)<a1&&a0<mins(x.alle))));
}
function occForRange(from,days){
  const out=[], keys=new Set();
  for(let i=0;i<days;i++)keys.add(iso(addDays(from,i)));
  const mk=(s,orig,v)=>{const id=s.id+"_"+orig, reg=byId("registro",id);
    return {kind:"fisso",id,sede:s,orig,data:(v&&v.data)||orig,ora:(v&&v.ora)||s.ora||"18:00",durata:v&&v.durata!=null?+v.durata:(Number(s.durata)||0),operatori:(v&&v.operatori)||s.operatori||[],nota:(v&&v.nota)||"",var:v||null,stato:reg?reg.stato:"pianificato"}};
  for(let i=0;i<days;i++){
    const d=addDays(from,i), key=iso(d), dow=isoDow(d);
    S.sedi.forEach(s=>{
      if(s.attiva===false||!(s.giorni||[]).includes(dow))return;
      const o=mk(s,key,byId("variazioni",s.id+"_"+key)); if(keys.has(o.data))out.push(o);
    });
    S.straordinari.filter(x=>x.data===key).forEach(x=>{
      out.push({kind:"extra",id:x.id,sede:byId("sedi",x.sedeId)||{nome:"Sede eliminata"},data:key,orig:key,ora:x.ora||"09:00",durata:Number(x.durata)||0,operatori:x.operatori||[],nota:x.descrizione||"",stato:x.stato||"pianificato"});
    });
  }
  // turni spostati dentro il periodo da un giorno fuori periodo
  S.variazioni.forEach(v=>{ if(!keys.has(v.data)||keys.has(v.origData))return; const s=byId("sedi",v.sedeId); if(s&&s.attiva!==false)out.push(mk(s,v.origData,v)) });
  out.sort((a,b)=>a.data===b.data?mins(a.ora)-mins(b.ora):a.data<b.data?-1:1);
  const conf=new Set(), byDay={};
  out.forEach(o=>{if(o.stato!=="saltato")(byDay[o.data]=byDay[o.data]||[]).push(o)});
  Object.values(byDay).forEach(list=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const a=list[i],b=list[j],a0=mins(a.ora),a1=a0+a.durata*60,b0=mins(b.ora),b1=b0+b.durata*60;

/* ---------- contabilità: calcoli ---------- */
// righe: {descr,qta,prezzo,iva}; compatibilità con le bozze precedenti {descr,imponibile}
// ogni riga ha il suo codice IVA (cod); i documenti vecchi con regime unico vengono convertiti al volo
function righeOf(d){return (d.righe||[]).map(r=>{const x=r.prezzo!==undefined?Object.assign({},r):{descr:r.descr,qta:1,prezzo:+r.imponibile||0}; if(!x.cod)x.cod=legacyCod(d.regime,r.iva!=null?r.iva:d.iva); return x})}
function riepilogo(rows){const m={};rows.forEach(r=>{const c=codOf(r.cod),b=(+r.qta||0)*(+r.prezzo||0);(m[c.id]=m[c.id]||{c,imp:0,iva:0});m[c.id].imp+=b;m[c.id].iva+=(c.t==="norm"||c.t==="split")?b*(+c.al||0)/100:0});return Object.values(m).map(x=>({c:x.c,imp:r2(x.imp),iva:r2(x.iva)}))}
function vTot(f){
  const riep=riepilogo(righeOf(f)), sum=(fl,k)=>r2(riep.filter(fl).reduce((a,x)=>a+x[k],0));
  const imp=sum(()=>1,"imp"), ivaDeb=sum(x=>x.c.t==="norm","iva"), ivaSplit=sum(x=>x.c.t==="split","iva");
  const iva=r2(ivaDeb+ivaSplit), tot=r2(imp+iva);
  const rit=f.ritenuta&&f.tipo!=="nc"?r2(sum(x=>x.c.t!=="excl","imp")*0.04):0;
  const tags=[...new Set(riep.filter(x=>x.c.t!=="norm").map(x=>codTag(x.c)))];
  return {imp,iva,ivaDeb,ivaSplit,tot,rit,dovuto:r2(tot-ivaSplit-rit),riep,tags,rcImp:sum(x=>x.c.t==="rc","imp")};
}
function aTot(a){
  const riep=riepilogo(righeOf(a));
  const imp=r2(riep.reduce((x,y)=>x+y.imp,0));
  const iva=r2(riep.reduce((x,y)=>x+y.iva,0));
  const tot=r2(imp+iva), rit=r2(imp*(+a.ritenutaPct||0)/100);
  return {imp,iva,tot,rit,dovuto:r2(tot-rit)};
}
const conti=()=>{const m=new Map(DEF_CONTI.map(c=>[c.id,Object.assign({},c)]));S.conti.forEach(c=>m.set(c.id,c));return [...m.values()]};
const contoNome=id=>{const c=conti().find(x=>x.id===id);return c?c.nome:"—"};
function saldoConto(id,upto){

}
// abbinamenti: chiave documento "v:id" (vendita) o "a:id" (acquisto); fonte "m:id" (movimento) o "n:id" (nota di credito)
let _alloc=null,_allocVer=-1;
function allocMap(){
  if(_allocVer===ver&&_alloc)return _alloc;
  const byDoc={},bySrc={};
  const add=(src,list)=>(list||[]).forEach(x=>{const v=+x.importo||0; if(!v||!x.doc)return; (byDoc[x.doc]=byDoc[x.doc]||[]).push({src,v,rata:+x.rata||0}); bySrc[src]=(bySrc[src]||0)+v});
  S.movimenti.forEach(m=>add("m:"+m.id,m.alloc));
  S.fatture.filter(f=>f.tipo==="nc").forEach(f=>add("n:"+f.id,f.alloc));
  _alloc={byDoc,bySrc};_allocVer=ver;return _alloc;
}
function allocated(docKey,excl){return r2((allocMap().byDoc[docKey]||[]).filter(x=>x.src!==excl).reduce((a,x)=>a+x.v,0))}
function residuoV(f,excl){ if(f.tipo==="nc")return 0; const t=vTot(f), al=allocated("v:"+f.id,excl); if(f.stato==="pagata"&&!al)return 0; return r2(t.dovuto-al) }
function residuoA(a,excl){ const al=allocated("a:"+a.id,excl); if(a.stato==="pagata"&&!al)return 0; return r2(aTot(a).dovuto-al) }
function nonAbbinato(src){ // importo ancora da abbinare di un movimento o nota di credito
  if(src.startsWith("m:")){const m=byId("movimenti",src.slice(2)); if(!m)return 0; return r2((+m.importo||0)-(allocMap().bySrc[src]||0))}
  const f=byId("fatture",src.slice(2)); if(!f)return 0; return r2(vTot(f).tot-(allocMap().bySrc[src]||0));
}
function statoV(f){

}
function statoA(a){

function mastrino(sogg){
  const[t,id]=sogg.split(":"); const rows=[];
  if(t==="c"){
    S.fatture.filter(f=>f.clienteId===id).forEach(f=>{const x=vTot(f);
      if(f.tipo==="nc"){rows.push({data:f.data,descr:"Nota di credito "+f.numero,dare:0,avere:x.tot,ref:"v:"+f.id});return}

      if(x.rit)rows.push({data:f.data,descr:"Ritenuta 4% trattenuta, fatt. "+f.numero,dare:0,avere:x.rit,ref:"v:"+f.id});

      rows.push({data:a.data,descr:"Fattura "+a.numero+(a.protocollo?" · prot. "+a.protocollo:""),dare:0,avere:x.tot,ref:"a:"+a.id});

function alerts(){
  const a=[]; const occ=occForRange(monday(today()),7);
  const conf=occ.filter(o=>o.conflitto);
  if(conf.length){const days=[...new Set(conf.map(o=>o.data))].map(d=>GIORNI[isoDow(parse(d))-1]).join(", "); a.push(["bad",`Operatore assegnato a due sedi nello stesso orario questa settimana (${days}).`,"piano"])}
  const scop=occForRange(today(),7).filter(o=>o.scoperto);
  if(scop.length)a.push(["bad",`${scop.length} turn${scop.length>1?"i":"o"} da coprire nei prossimi 7 giorni: operatori assenti o squadra vuota.`,"agenda"]);
  S.sedi.filter(s=>s.attiva!==false&&!(s.operatori||[]).length).forEach(s=>a.push(["bad",`${s.nome}: nessun operatore assegnato.`,"clienti"]));
  S.operatori.filter(o=>o.attivo!==false&&Number(o.oreSettimanali)).forEach(o=>{const h=oreSettimana(o.id,occ); if(h>o.oreSettimanali) a.push(["warn",`${o.nome}: ${n1(h)} h pianificate su ${o.oreSettimanali} h di contratto.`,"personale"])});
  const scad=S.fatture.filter(f=>f.tipo!=="nc"&&statoV(f)[1]==="bad");
  if(scad.length)a.push(["bad",`${scad.length} fattur${scad.length>1?"e di vendita scadute":"a di vendita scaduta"}: ${eur(scad.reduce((x,f)=>x+residuoV(f),0))} da incassare.`,"partite"]);
  const lim7=iso(addDays(today(),7));
  const pag=S.acquisti.filter(x=>rateDoc("a",x).some(r=>r.res>0.005&&r.data<=lim7));
  if(pag.length)a.push([pag.some(x=>rateDoc("a",x).some(r=>r.res>0.005&&r.data<TODAY()))?"bad":"warn",`${pag.length} fattur${pag.length>1?"e fornitori":"a fornitore"} scadute o in scadenza entro 7 giorni: ${eur(pag.reduce((s,x)=>s+residuoA(x),0))}.`,"partite"]);
  const na=S.movimenti.filter(m=>m.tipo==="entrata"&&movSogg(m).startsWith("c:")&&nonAbbinato("m:"+m.id)>0.005);
  if(na.length)a.push(["warn",`${na.length} incass${na.length>1?"i":"o"} da abbinare alle fatture.`,"partite"]);
  S.sedi.filter(s=>s.attiva!==false).forEach(s=>{const m=marginePct(s); if(m!=null&&m<10)a.push(["warn",`${s.nome}: margine stimato ${Math.round(m)}%. Rivedi canone o ore.`,"clienti"])});
  S.sedi.filter(s=>s.attiva!==false).forEach(s=>{const l=lastIspezione(s.id); if(l){const p=punteggio(l.voti); if(p!=null&&p<70)a.push(["warn",`${s.nome}: ultima ispezione ${p}/100.`,"qualita"])}});
  const mk=monthKey(today()); if(S.sedi.some(s=>s.attiva!==false&&+s.canone>0)&&!S.fatture.some(f=>f.mese===mk)) a.push(["warn",`Fatture dei canoni di ${monthLabel(mk)} non ancora preparate.`,"vendite"]);
  conti().forEach(c=>{const s=saldoConto(c.id); if(s<0)a.push(["bad",`${c.nome}: saldo negativo ${eur2(s)}.`,"primanota"])});
  avvisiGare(a);
  const sc=S.fatture.filter(f=>["scartata","rifiutata"].includes(sdiStato(f)));
  if(sc.length)a.push(["bad",`${sc.length} fattur${sc.length>1?"e scartate":"a scartata"} dallo SdI: correggi e reinvia entro 5 giorni dallo scarto.`,"vendite"]);
  const dal=azienda().feDal;
  if(dal){ const ni=S.fatture.filter(f=>f.data>=dal&&!SDI_TRASMESSA.includes(sdiStato(f))&&!["scartata","rifiutata"].includes(sdiStato(f)));
    const l12=iso(addDays(today(),-12)), l8=iso(addDays(today(),-8));
    const late=ni.filter(f=>f.data<l12), soon=ni.filter(f=>f.data>=l12&&f.data<=l8);
    if(late.length)a.push(["bad",`${late.length} fattur${late.length>1?"e non trasmesse":"a non trasmessa"} allo SdI oltre i 12 giorni dalla data.`,"vendite"]);
    if(soon.length)a.push(["warn",`${soon.length} fattur${soon.length>1?"e":"a"} da trasmettere allo SdI nei prossimi giorni (termine: 12 giorni dalla data).`,"vendite"]); }
  return a;
}

function letteraSollecito(am){

    if(!ds.length)return""; let sc=0;
    const l=ds.map(x=>x.rs.map(r=>{sc+=r.res;return `  - ${vLabel(x.f)} del ${dShort(x.f.data)}${x.rs.length>1||rateDoc("v",x.f).length>1?", rata "+r.n:""}, scaduta il ${dShort(r.data)}: ${eur2(r.res)}`}).join("\n")).join("\n");

function vPrimaNota(){
  const cs=conti(); const mk=UI.pnMese;
  let list=S.movimenti.filter(m=>!mk||(m.data||"").startsWith(mk));
  if(UI.pnConto)list=list.filter(m=>m.conto===UI.pnConto||m.contoDest===UI.pnConto);
  list.sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  let prog=null;
  if(UI.pnConto){ const first=list[0]; prog=first?saldoConto(UI.pnConto,iso(addDays(parse(first.data),-1))):saldoConto(UI.pnConto) }
  let ent=0,usc=0;
  const rows=list.map(m=>{const v=+m.importo||0; let e=0,u=0;
    if(m.tipo==="entrata")e=v; else if(m.tipo==="uscita")u=v; else if(UI.pnConto){ if(m.contoDest===UI.pnConto)e=v; else u=v }
    ent+=e;usc+=u; if(prog!=null)prog=r2(prog+e-u);
    const docs=(m.alloc||[]).map(x=>{const[t,id]=x.doc.split(":");const d=t==="v"?byId("fatture",id):byId("acquisti",id);return d?(t==="v"?vLabel(d):aLabel(d)):""}).filter(Boolean).join(", ");
    const na=(m.tipo!=="giroconto"&&movSogg(m))?nonAbbinato("m:"+m.id):0;
    return `<tr class="click" data-edit="movimenti:${m.id}"><td class="mono small">${dShort(m.data)}</td><td class="small">${m.tipo==="giroconto"?esc(contoNome(m.conto))+" → "+esc(contoNome(m.contoDest)):esc(contoNome(m.conto))}</td><td>${esc(m.causale||"")}<div class="small muted">${esc([soggNome(movSogg(m)),m.descrizione,docs].filter(Boolean).join(" · "))}</div>${na>0.005&&(m.causale==="Incasso cliente"||m.causale==="Pagamento fornitore")?` <span class="pill warn">${eur2(na)} da abbinare</span>`:""}</td><td class="r num pos">${e?eur2(e):m.tipo==="giroconto"&&!UI.pnConto?eur2(v):""}</td><td class="r num neg">${u?eur2(u):""}</td>${prog!=null?`<td class="r num">${eur2(prog)}</td>`:""}</tr>`}).join("");
  const mesi=[...new Set(S.movimenti.map(m=>(m.data||"").slice(0,7)).filter(Boolean))].sort().reverse();
  return head("Prima nota",`Liquidità totale ${eur2(cs.reduce((a,c)=>a+saldoConto(c.id),0))}`,`<button class="btn" data-wiz="c:">Incasso da cliente</button><button class="btn" data-wiz="f:">Pagamento a fornitore</button><button class="btn" data-new="conti">Nuovo conto</button><button class="btn" data-new="movimenti" data-giro="1">Giroconto</button><button class="btn primary" data-new="movimenti">Registra movimento</button>`)+
  `<div class="saldi">${cs.map(c=>{const s=saldoConto(c.id);return `<button class="saldo" data-pnconto="${c.id}" aria-pressed="${UI.pnConto===c.id}"><span class="label">${esc(c.nome)}</span><span class="v ${s<0?"neg":""}">${eur2(s)}</span><span class="small muted">${c.iban?esc(c.iban):"saldo iniziale "+eur2(c.saldoIniziale||0)}</span></button>`}).join("")}</div>
  <section class="panel"><div class="ph"><div class="actions"><select id="pnConto" class="btn" aria-label="Conto"><option value="">Tutti i conti</option>${cs.map(c=>`<option value="${c.id}" ${UI.pnConto===c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select>
  <select id="pnMese" class="btn" aria-label="Mese"><option value="">Tutti i mesi</option>${mesi.map(k=>`<option value="${k}" ${mk===k?"selected":""}>${cap(monthLabel(k))}</option>`).join("")}</select>${UI.pnConto?`<button class="btn small" data-editconto="${UI.pnConto}">Modifica conto</button>`:""}</div><span class="small muted">${list.length} movimenti</span></div>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Conto</th><th>Causale e dettaglio</th><th class="r">Entrate</th><th class="r">Uscite</th>${prog!=null?'<th class="r">Saldo</th>':""}</tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">Totale periodo</td><td class="r num">${eur2(ent)}</td><td class="r num">${eur2(usc)}</td>${prog!=null?`<td class="r num">${eur2(prog)}</td>`:""}</tr></tfoot></table></div>`:`<p class="muted">Nessun movimento. Registra incassi, pagamenti, stipendi, F24 e spese: ogni movimento aggiorna il saldo del conto e, se lo abbini, le partite aperte.</p>`}</section>

// estratto conto a partite: per ogni documento, le registrazioni che lo chiudono fino a saldo
function partiteDi(sogg){
  const[t,id]=sogg.split(":"), out=[];
  const allocRows=key=>(allocMap().byDoc[key]||[]).map(x=>{
    if(x.src.startsWith("m:")){const m=byId("movimenti",x.src.slice(2)); if(!m)return null;
      return {data:m.data,descr:(m.tipo==="entrata"?"Incasso":"Pagamento")+(x.rata?" rata "+x.rata:"")+" · "+contoNome(m.conto)+(m.descrizione?" · "+m.descrizione:""),v:x.v,ref:"movimenti:"+m.id,parz:r2(+m.importo)>x.v+0.005?r2(+m.importo):0}}
    const n=byId("fatture",x.src.slice(2)); return n?{data:n.data,descr:"Compensazione con nota di credito "+n.numero,v:x.v,ref:"fatture:"+n.id}:null}).filter(Boolean);
  if(t==="c"){
    S.fatture.filter(f=>f.clienteId===id).forEach(f=>{const x=vTot(f);
      if(f.tipo==="nc"){
        const rows=(f.alloc||[]).map(a=>{const ff=byId("fatture",a.doc.slice(2));return {data:f.data,descr:"Compensata su fattura "+(ff?ff.numero:"eliminata"),v:+a.importo,ref:ff?"fatture:"+ff.id:"fatture:"+f.id}});
        out.push({key:"n:"+f.id,nc:true,label:"Nota di credito "+f.numero,data:f.data,scad:"",tot:x.tot,rows,res:nonAbbinato("n:"+f.id),ref:"fatture:"+f.id});return}
      const rows=[];
      if(x.rit)rows.push({data:f.data,descr:"Ritenuta 4% trattenuta dal condominio",v:x.rit,fix:1});
      if(x.ivaSplit)rows.push({data:f.data,descr:"IVA versata direttamente dalla PA (scissione pagamenti)",v:x.ivaSplit,fix:1});
      const al=allocRows("v:"+f.id); rows.push(...al);
      if(f.stato==="pagata"&&!al.length)rows.push({data:f.data,descr:"Incasso segnato senza prima nota",v:x.dovuto,fix:1});
      out.push({key:"v:"+f.id,label:"Fattura "+f.numero,data:f.data,scad:(prossimaRata("v",f)||{}).data,rate:rateDoc("v",f),pag:pagOf(f.pagamento),tot:x.tot,rows,res:residuoV(f),ref:"fatture:"+f.id,tags:x.tags});
    });
  }else{
    S.acquisti.filter(a=>a.fornitoreId===id).forEach(a=>{const x=aTot(a); const rows=[];
      if(x.rit)rows.push({data:a.data,descr:"Ritenuta d'acconto trattenuta (da versare con F24)",v:x.rit,fix:1});
      const al=allocRows("a:"+a.id); rows.push(...al);
      if(a.stato==="pagata"&&!al.length)rows.push({data:a.data,descr:"Pagamento segnato senza prima nota",v:x.dovuto,fix:1});
      out.push({key:"a:"+a.id,label:"Fattura "+a.numero+(a.protocollo?" · prot. "+a.protocollo:""),data:a.data,scad:(prossimaRata("a",a)||{}).data,rate:rateDoc("a",a),pag:pagOf(a.pagamento),tot:x.tot,rows,res:residuoA(a),ref:"acquisti:"+a.id});
    });
  }
  out.forEach(p=>p.rows.sort((a,b)=>(b.fix||0)-(a.fix||0)||(a.data||"").localeCompare(b.data||"")));
  out.sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  return out;
}
function nonAbbinatiDi(sogg){
  const isC=sogg[0]==="c";
  return S.movimenti.filter(m=>m.tipo===(isC?"entrata":"uscita")&&movSogg(m)===sogg).map(m=>({src:"m:"+m.id,data:m.data,label:(isC?"Incasso":"Pagamento")+" del "+dShort(m.data)+" · "+contoNome(m.conto)+(m.descrizione?" · "+m.descrizione:""),tot:+m.importo,v:nonAbbinato("m:"+m.id)})).filter(x=>x.v>0.005);
}
function vPartite(){
  const lato=UI.paLato, isC=lato==="c", tutte=!!UI.paTutte;
  const anag=(isC?S.clienti.filter(c=>ammFilter(UI.paAmm,c.id)):S.fornitori).slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const sogg=anag.map(x=>{const k=lato+":"+x.id;const docs=openDocs(k);const b=[0,0,0,0,0];docs.forEach(d=>(d.rate&&d.rate.length?d.rate.filter(r=>r.res>0.005):[{data:d.scad,res:d.res}]).forEach(r=>b[aging(r.data)]+=r.res));
    const na=nonAbbinatiDi(k), nc=isC?S.fatture.filter(f=>f.tipo==="nc"&&f.clienteId===x.id).reduce((a,f)=>a+Math.max(0,nonAbbinato("n:"+f.id)),0):0;

    .filter(s=>tutte?s.hasDocs||s.sosp>0.005:(s.docs.length||s.sosp>0.005));

    const body=parts.map(p=>{

      const head=`<tr class="ph-row click" data-edit="${p.ref}"><td class="mono small">${dShort(p.data)}</td><td><b>${esc(p.label)}</b>${p.nc?' <span class="pill acc">Credito del cliente</span>':""}${(p.tags||[]).map(t=>` <span class="pill">${esc(t)}</span>`).join("")}<div class="small muted">${p.pag?esc(p.pag.descrizione)+" · ":""}${(p.rate||[]).length>1?p.rate.map(r=>`<span class="${r.res<=0.005?"pos":r.data<TODAY()?"neg":""}">${dShort(r.data).slice(0,5)} ${eur2(r.importo)}${r.res<=0.005?" ✓":""}</span>`).join(" · "):p.scad?"scadenza "+dShort(p.scad):""}${p.scad&&p.res>0.005?` · <span class="${a>=2?"neg":""}">${AGE[a].toLowerCase()}</span>`:""}</div></td>${p.nc?cols("",eur2(p.tot)):cols(eur2(p.tot),"")}<td class="r num"><b>${eur2(p.tot)}</b></td><td class="r">${p.res>0.005&&!p.nc?`<button class="btn small primary" data-${isC?"incassa":"paga"}="${p.key.slice(2)}">${isC?"Registra incasso":"Registra pagamento"}</button>`:p.res>0.005&&p.nc?`<button class="btn small" data-abbina="${p.key}">Compensa</button>`:""}</td></tr>`;
      const rows=p.rows.map(r=>{run=r2(run-r.v); if(!p.nc)sPay+=r.v; else sDoc+=r.v;
        return `<tr class="sub ${r.ref?"click":""}" ${r.ref?`data-edit="${r.ref}"`:""}><td class="mono small">${dShort(r.data)}</td><td class="small">${esc(r.descr)}${r.parz?` <span class="muted">(quota di un movimento da ${eur2(r.parz)})</span>`:""}</td>${p.nc?cols(eur2(r.v),""):cols("",eur2(r.v))}<td class="r num">${eur2(run)}</td><td></td></tr>`}).join("");
      sRes+=p.nc?-p.res:p.res;
      const foot=`<tr class="pf-row"><td></td><td class="small">${p.res>0.005?(p.nc?"Ancora da compensare":isC?"Residuo da incassare":"Residuo da pagare"):"Partita chiusa"}</td><td></td><td></td><td class="r num"><b>${eur2(p.res)}</b></td><td class="r">${p.res>0.005?(p.nc?pill(["Aperta","acc"]):pill(a>=1?["Scaduta","bad"]:p.res<p.tot-0.005?["Parziale","warn"]:["Aperta",""])):pill([isC?(p.nc?"Compensata":"Incassata"):"Pagata","ok"])}</td></tr>`;
      return head+rows+foot;
    }).join("");
    const naRows=na.map(c=>{sPay+=c.v; sRes-=c.v; return `<tr class="sub"><td class="mono small">${dShort(c.data)}</td><td class="small">${esc(c.label)}${c.tot>c.v+0.005?` <span class="muted">(parte non abbinata di ${eur2(c.tot)})</span>`:""}</td><td class="r num">${isC?"":eur2(c.v)}</td><td class="r num">${isC?eur2(c.v):""}</td><td class="r num">${eur2(c.v)}</td><td class="r"><button class="btn small" data-abbina="${c.src}" ${openDocs(selK).length?"":"disabled"}>Abbina</button></td></tr>`}).join("");
    est=`<section class="panel"><div class="ph"><div><h2>Estratto conto a partite · ${esc(selX.nome)}</h2><span class="small muted">${tutte?"Tutte le partite, anche saldate":"Solo partite aperte"} · ${isC?"fatture emesse in Dare, incassi in Avere":"fatture ricevute in Avere, pagamenti in Dare"}</span></div>
      <div class="actions"><button class="btn small primary" data-wiz="${selK}">${isC?"Incassa fatture":"Paga fatture"}</button><button class="btn small" data-mastrino="${selK}">Mastrino cronologico</button><button class="btn small" data-new="movimenti" data-tipo="${isC?"entrata":"uscita"}" data-sogg="${selK}">${isC?"Incasso senza fattura (acconto)":"Pagamento senza fattura (anticipo)"}</button></div></div>

      :`<p class="muted">${tutte?"Nessun documento registrato.":"Nessuna partita aperta: tutte le fatture risultano "+(isC?"incassate.":"pagate.")} ${tutte?"":'Attiva "Mostra anche le partite chiuse" per vedere lo storico.'}</p>`}

    <label class="btn" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="paTutte" ${tutte?"checked":""} style="accent-color:var(--accent)">Mostra anche le partite chiuse</label>`)+
  `<section class="panel"><h2>Anzianità per ${isC?"cliente":"fornitore"}</h2>${sogg.length?`<div class="tablewrap"><table><thead><tr><th>${isC?"Cliente":"Fornitore"}</th>${AGE.map(a=>`<th class="r">${a}</th>`).join("")}<th class="r">Totale aperto</th><th class="r">Da abbinare</th></tr></thead><tbody>${sogg.map(s=>`<tr class="click ${s.k===selK?"sel":""}" data-pasel="${s.k}"><td><b>${esc(s.x.nome)}</b></td>${s.b.map((v,i)=>`<td class="r num ${i>=2&&v>0?"neg":""}">${v?eur2(v):"—"}</td>`).join("")}<td class="r num"><b>${eur2(s.tot)}</b></td><td class="r num">${s.sosp>0.005?eur2(s.sosp):"—"}</td></tr>`).join("")}</tbody><tfoot><tr><td>Totale</td>${T.map(v=>`<td class="r num">${eur2(v)}</td>`).join("")}<td class="r num">${eur2(T.reduce((a,b)=>a+b,0))}</td><td></td></tr></tfoot></table></div>`:`<p class="muted">Nessuna partita aperta verso ${isC?"clienti":"fornitori"}.</p>`}</section>`+est;

function vMastrini(){
  const opts=[...S.clienti.filter(c=>ammFilter(UI.maAmm,c.id)).map(c=>["c:"+c.id,c.nome,"Clienti"]),...(UI.maAmm?[]:S.fornitori.map(f=>["f:"+f.id,f.nome,"Fornitori"]))];
  const sel=UI.maSel&&opts.some(o=>o[0]===UI.maSel)?UI.maSel:(opts[0]||[])[0];
  const ys=[...new Set([...anni(S.fatture,"data"),...anni(S.acquisti,"data"),...anni(S.movimenti,"data")])].sort().reverse(); const y=UI.maAnno||ys[0];
  let mast="";
  if(sel){
    const all=mastrino(sel), isC=sel[0]==="c";
    const prev=all.filter(r=>(r.data||"")<y+"-01-01"), cur=all.filter(r=>(r.data||"").startsWith(y));
    let s=prev.reduce((a,r)=>a+r.dare-r.avere,0);
    const DA=v=>{const x=r2(v);return x===0?"0,00":eur2(Math.abs(x))+(x>0?" D":" A")};
    let D=0,A=0;
    mast=`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrizione</th><th class="r">Dare</th><th class="r">Avere</th><th class="r">Saldo</th></tr></thead><tbody>
    <tr><td class="mono small">01/01/${y}</td><td class="muted">Saldo di apertura</td><td></td><td></td><td class="r num">${DA(s)}</td></tr>
    ${cur.map(r=>{s+=r.dare-r.avere;D+=r.dare;A+=r.avere;const[t,id]=r.ref.split(":");const tgt=t==="v"?"fatture":t==="a"?"acquisti":"movimenti";return `<tr class="click" data-edit="${tgt}:${id}"><td class="mono small">${dShort(r.data)}</td><td>${esc(r.descr)}</td><td class="r num">${r.dare?eur2(r.dare):""}</td><td class="r num">${r.avere?eur2(r.avere):""}</td><td class="r num">${DA(s)}</td></tr>`}).join("")}</tbody>
    <tfoot><tr><td colspan="2">Movimenti ${y} e saldo finale</td><td class="r num">${eur2(D)}</td><td class="r num">${eur2(A)}</td><td class="r num">${DA(s)}</td></tr></tfoot></table></div>
    <p class="note">${isC?"Cliente: saldo in Dare = credito da incassare; in Avere = acconti o note di credito a favore del cliente.":"Fornitore: saldo in Avere = debito da pagare; in Dare = anticipi versati."}</p>`;
  }
  // IVA
  const per=UI.ivaPer||monthKey(today());

  const avg=a=>{const v=a.filter(x=>x!=null&&isFinite(x)); return v.length?v.reduce((s,x)=>s+ +x,0)/v.length:null};
  const grp=(k)=>{const m={}; pres.forEach(g=>{const n=k(g)||"—"; (m[n]=m[n]||[]).push(g)}); return Object.entries(m).sort((a,b)=>b[1].length-a[1].length)};

  <section class="panel"><h2>Per procedura</h2>${pres.length?`<div class="tablewrap"><table><thead><tr><th>Procedura</th><th class="r">Offerte</th><th class="r">Vinte</th></tr></thead><tbody>${grp(g=>(PROCEDURE.find(p=>p[0]===g.procedura)||["",g.tipo==="privata"?"Richiesta privata":"Non indicata"])[1]).map(([k,a])=>`<tr><td>${esc(k)}</td><td class="r num">${a.length}</td><td class="r num">${a.filter(g=>GARA_VINTA.includes(g.stato)).length}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">—</p>`}</section></div>
  <div class="grid2"><section class="panel"><h2>Concorrenti incontrati</h2>${Object.keys(conc).length?`<div class="tablewrap"><table><thead><tr><th>Impresa</th><th class="r">Gare</th><th class="r">Vinte</th><th class="r">Ribasso medio</th></tr></thead><tbody>${Object.entries(conc).sort((a,b)=>b[1].n-a[1].n).slice(0,15).map(([k,o])=>`<tr><td>${esc(k)}</td><td class="r num">${o.n}</td><td class="r num">${o.v}</td><td class="r num">${pctTxt(avg(o.r))}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">Inserisci i concorrenti nell'esito delle gare per vederli qui.</p>`}</section>

}

   ${r("Manodopera",eur(c.manodopera))}${r("Materiali e prodotti",eur(c.materiali))}${c.attrezz?r("Attrezzature",eur(c.attrezz)):""}${c.sicur?r("Sicurezza aziendale",eur(c.sicur)):""}
   ${r("Spese generali",eur(c.generali))}${r("Utile",eur(c.utile))}${r("Prezzo annuo",eur(c.annuo),1)}
   ${r(`Totale offerta per ${n1(c.anni*12)} mesi${c.oneri?" (con "+eur(c.oneri)+" di oneri per la sicurezza)":""}`,eur(c.totale),1)}

const storageOk=()=>!!(sb&&sb.storage);
function scegliFile(){ return new Promise(res=>{const i=document.createElement("input"); i.type="file"; i.accept=".pdf,.p7m,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip,.xml"; i.onchange=()=>res(i.files[0]||null); i.click()}) }
async function caricaAllegato(cartella,file){
  if(!storageOk()){toast("Spazio file non disponibile");return null}
  if(file.size>20*1024*1024){toast("Il file supera 20 MB");return null}
  const nome=String(file.name||"file").replace(/[^\w.\-]+/g,"_").slice(-80), path=`${cartella}/${rid()}-${nome}`;
  const {error}=await sb.storage.from("allegati").upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error){toast("Caricamento non riuscito: "+(error.message||"errore"));return null}
  return {path,nome:file.name};
}

function estraiXml(buf){
  const u8=new Uint8Array(buf); let s=""; for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  const trova=str=>{const a=str.search(/<\?xml|<([\w.-]+:)?FatturaElettronica[\s>]/); if(a<0)return null; const m=str.slice(a).match(/<\/([\w.-]+:)?FatturaElettronica>/); if(!m)return null; return str.slice(a,a+m.index+m[0].length)};
  let x=trova(s);
  if(!x){ try{ const b=atob(s.replace(/[^A-Za-z0-9+/=]/g,"")); x=trova(b) }catch(e){} }
  if(!x)return null;
  const dec=t=>{const b=new Uint8Array(t.length); for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i)&255; return new TextDecoder("utf-8").decode(b)};
  let txt=dec(x); const p=new DOMParser(); const ok=t=>!p.parseFromString(t.replace(/<(\/?)[\w.-]+:/g,"<$1"),"text/xml").getElementsByTagName("parsererror").length;
  if(!ok(txt)){ const pulito=dec(x.replace(/\x04\x82[\s\S]{2}|\x04\x81[\s\S]/g,"")); if(ok(pulito))txt=pulito; }
  return txt;
}
function leggiFE(txt){
  const doc=new DOMParser().parseFromString(txt.replace(/<(\/?)[\w.-]+:/g,"<$1").replace(/\s[\w.-]+:[\w.-]+="[^"]*"/g,""),"text/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("file XML non leggibile");
  const q=(el,path)=>{let n=el; for(const p of path.split("/")){ if(!n)return null; n=[...n.children].find(c=>c.tagName===p)||null } return n};
  const v=(el,path)=>{const n=q(el,path);return n?n.textContent.trim():""};
  const H=doc.getElementsByTagName("FatturaElettronicaHeader")[0]; if(!H)throw new Error("non è una FatturaPA");
  const ced=q(H,"CedentePrestatore"), dA=q(ced,"DatiAnagrafici"), an=q(dA,"Anagrafica");
  const forn={piva:v(dA,"IdFiscaleIVA/IdCodice"),paese:v(dA,"IdFiscaleIVA/IdPaese"),cf:v(dA,"CodiceFiscale"),nome:v(an,"Denominazione")||(v(an,"Nome")+" "+v(an,"Cognome")).trim(),indirizzo:(v(ced,"Sede/Indirizzo")+" "+v(ced,"Sede/NumeroCivico")).trim(),cap:v(ced,"Sede/CAP"),comune:v(ced,"Sede/Comune"),provincia:v(ced,"Sede/Provincia")};
  const cessPiva=v(H,"CessionarioCommittente/DatiAnagrafici/IdFiscaleIVA/IdCodice");
  return [...doc.getElementsByTagName("FatturaElettronicaBody")].map(B=>{
    const g=q(B,"DatiGenerali/DatiGeneraliDocumento");
    const righe=[...(q(B,"DatiBeniServizi")||{children:[]}).children].filter(n=>n.tagName==="DettaglioLinee").map(l=>{
      const al=+v(l,"AliquotaIVA")||0, nat=v(l,"Natura"), qt=+v(l,"Quantita")||1, pu=+v(l,"PrezzoUnitario")||0, pt=+v(l,"PrezzoTotale")||0;
      const cod=al?(CODICI_BASE.some(c=>c.t==="norm"&&+c.al===al)?String(al):"22"):(/^N6/.test(nat)?"RC":/^N1/.test(nat)?"N1":/^N3/.test(nat)?"N3":/^N4/.test(nat)?"N4":"N2");
      const usaQ=Math.abs(r2(qt*pu)-pt)<0.011;
      return {descr:v(l,"Descrizione"),qta:usaQ?qt:1,prezzo:usaQ?pu:pt,cod,al,nat}});
    const ritN=q(g,"DatiRitenuta");
    const pag=[...((q(B,"DatiPagamento")||{children:[]}).children)].filter(n=>n.tagName==="DettaglioPagamento").map(d=>({mp:v(d,"ModalitaPagamento"),data:v(d,"DataScadenzaPagamento"),importo:+v(d,"ImportoPagamento")||0,iban:v(d,"IBAN")}));
    return {forn,cessPiva,tipo:v(g,"TipoDocumento"),numero:v(g,"Numero"),data:v(g,"Data"),totale:+v(g,"ImportoTotaleDocumento")||null,righe,rit:ritN?{aliquota:+v(ritN,"AliquotaRitenuta")||0,importo:+v(ritN,"ImportoRitenuta")||0}:null,pag};
  });
}
async function leggiFilesXml(files){
  const docs=[], errori=[];
  for(const file of files){
    try{
      const buf=await file.arrayBuffer();
      if(/\.zip$/i.test(file.name)){ if(!window.JSZip)throw new Error("zip non supportato"); const z=await JSZip.loadAsync(buf);
        for(const n of Object.keys(z.files).filter(n=>/\.(xml|p7m)$/i.test(n))){ const t=estraiXml(await z.files[n].async("arraybuffer")); if(!t){errori.push(n+": FatturaPA non trovata");continue} try{leggiFE(t).forEach(d=>docs.push(Object.assign(d,{file:n})))}catch(e){errori.push(n+": "+e.message)} } continue }
      const t=estraiXml(buf); if(!t){errori.push(file.name+": FatturaPA non trovata (file firmato non leggibile?)");continue}
      leggiFE(t).forEach(d=>docs.push(Object.assign(d,{file:file.name})));
    }catch(e){errori.push(file.name+": "+e.message)}
  }
  const A=azienda(), mia=String(A.piva||"").replace(/\s/g,"");
  docs.forEach(d=>{
    d.fornEsist=S.fornitori.find(x=>{const i=idFiscale(x);return (d.forn.piva&&i.piva===d.forn.piva)||(d.forn.cf&&i.cf===d.forn.cf.toUpperCase())})||null;
    d.dup=d.fornEsist&&S.acquisti.some(a=>a.fornitoreId===d.fornEsist.id&&String(a.numero)===d.numero&&a.data===d.data);
    d.avvisi=[]; if(mia&&d.cessPiva&&d.cessPiva!==mia)d.avvisi.push("intestata a un'altra partita IVA ("+d.cessPiva+")");
    if(d.righe.some(r=>/^N6/.test(r.nat)))d.avvisi.push("inversione contabile: integra l'IVA con il commercialista");
    if(!["TD01","TD04","TD24","TD25","TD06","TD02"].includes(d.tipo))d.avvisi.push("tipo documento "+d.tipo);
    d.sel=!d.dup&&!(mia&&d.cessPiva&&d.cessPiva!==mia);
  });
  current={c:"impxml",docs,errori}; renderImpXml();
}

/* ---------- fatture dei canoni ---------- */
async function genFatture(){
  const mk=fattMese, [y,m]=mk.split("-").map(Number);
  const existing=new Set(S.fatture.filter(f=>f.mese===mk&&f.tipo!=="nc"&&f.auto).map(f=>f.clienteId));
  const lastDay=iso(new Date(y,m,0)); const data=TODAY()<lastDay&&TODAY().startsWith(mk)?TODAY():lastDay;
  let created=0, skipped=0;
  for(const c of S.clienti.slice().sort((a,b)=>a.nome.localeCompare(b.nome))){
    const righe=[];
    const dc=cliCod(c), tpl=tplRows(c,mk+"-01");
    if(tpl.length) righe.push(...tpl.filter(r=>r.prezzo)); // le righe a zero (es. rimborsi variabili) si aggiungono a mano
    else S.sedi.filter(s=>s.clienteId===c.id&&s.attiva!==false&&+s.canone>0).forEach(s=>righe.push({descr:`Servizio di pulizia continuativo, ${s.nome}, ${monthLabel(mk)}`,qta:1,prezzo:+s.canone,cod:dc}));
    S.straordinari.filter(x=>(x.data||"").startsWith(mk)&&x.stato==="svolto"&&+x.importo>0).forEach(x=>{const s=byId("sedi",x.sedeId); if(s&&s.clienteId===c.id)righe.push({descr:`Intervento straordinario del ${dShort(x.data)}, ${s.nome}${x.descrizione?": "+x.descrizione:""}`,qta:1,prezzo:+x.importo,cod:dc})});
    if(!righe.length)continue;
    if(existing.has(c.id)){skipped++;continue}
    const numero=vendNum("fattura",data);
    const nd={tipo:"fattura",numero,clienteId:c.id,clienteNome:c.nome,data,mese:mk,righe,ritenuta:!!c.ritenuta,auto:true,alloc:[]};
    if(c.cig)nd.cig=c.cig; if(c.rifOrdine)nd.rifOrdine=c.rifOrdine;
    const pg=pagSogg(c), tt=vTot(nd); nd.pagamento=pg&&pg.id||""; nd.scadenze=calcScadenze(pg,data,tt.dovuto,tt.ivaDeb); nd.scadenza=nd.scadenze[0].data;
    const ok=await save("fatture",nd);
    if(!ok)break; created++;
  }
  toast(created?`Preparate ${created} fatture${skipped?`, ${skipped} clienti già fatturati`:""}.`:skipped?"Tutti i clienti sono già fatturati per questo mese.":"Nessun importo da fatturare: controlla canoni e straordinari svolti.");
}

async function removeExamples(btn){
  if(!btn.dataset.sure){btn.dataset.sure="1";btn.textContent="Conferma: elimina gli esempi";return}
  btn.disabled=true;
  const exSedi=new Set(S.sedi.filter(x=>x.esempio).map(x=>x.id)); let ko=0;
  const ops=S.registro.filter(r=>exSedi.has(r.sedeId)).map(x=>({tab:"registro",elimina:x.id}));
  ORDINE_COLS.slice().reverse().forEach(c=>{ if(c==="liste")return; S[c].filter(x=>x.esempio).sort((a,b)=>(b.tipo==="nc")-(a.tipo==="nc")).forEach(x=>{ if(c==="conti"&&DEF_CONTI.some(d=>d.id===x.id))return; ops.push({tab:DBS[c].t,elimina:x.id}) }) });
  try{ await salvaOps(ops) }catch(e){ for(const o of ops){ try{await salvaOps([o])}catch(e2){ko++} } }
  // i due conti predefiniti tornano ai valori iniziali
  const reset=DEF_CONTI.filter(d=>{const x=byId("conti",d.id); return x&&x.esempio}).map(d=>({c:"conti",o:Object.assign({},d)})); if(reset.length)await salvaMolti(reset);
  await loadAll(); ver++; render(); schedulePublish();
  toast(ko?`Dati di esempio rimossi, tranne ${ko} collegati a dati tuoi`:"Dati di esempio rimossi");
}

function traduci(m){
  m=String(m||"");
  if(/Invalid login credentials/i.test(m))return"Email o password non corretti.";
  if(/Email not confirmed/i.test(m))return"Devi prima confermare l'email: apri il messaggio che ti abbiamo mandato.";
  if(/already registered|already exists/i.test(m))return"Esiste già un account con questa email: premi Entra.";
  if(/Password should be/i.test(m))return"La password deve avere almeno 8 caratteri.";
  if(/rate limit|too many/i.test(m))return"Troppi tentativi o email inviate: riprova tra qualche minuto.";
  if(/Failed to fetch/i.test(m))return"Connessione assente: controlla internet e riprova.";
  return m;
}
async function authAction(kind){

  const redirect=location.href.split("#")[0].split("?")[0];
  try{
    if(kind==="newpw"){ if(pw.length<8){authMsg="La password deve avere almeno 8 caratteri.";return render()}
      const {error}=await sb.auth.updateUser({password:pw}); if(error)throw error;
      recovery=false; const {data:{session}}=await sb.auth.getSession(); if(session)return enter(session); authOk="Password aggiornata: ora puoi entrare."; return render() }
    if(!email){authMsg="Scrivi la tua email.";return render()}
    if(kind==="reset"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect}); if(error)throw error; authOk="Se l'email è registrata riceverai un link per scegliere una nuova password."; return render() }
    if(pw.length<8){authMsg="La password deve avere almeno 8 caratteri.";return render()}
    if(kind==="signup"){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:redirect}}); if(error)throw error;
      if(data.session)return enter(data.session); authOk="Account creato. Ti abbiamo mandato un'email: apri il link per confermarla, poi torna qui ed entra."; return render() }
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw}); if(error)throw error; return enter(data.session);
  }catch(e){ authMsg=traduci(e.message); render() }
}

async function loadTimb(){

function subscribe(){
  let ch=sb.channel("registro");
  Object.keys(TAB_COL).filter(t=>colsAttive().includes(TAB_COL[t])).forEach(t=>{ ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},p=>{
     const r=p.eventType==="DELETE"?p.old:p.new; if(!r||!r.id)return; const c=TAB_COL[t];
     if(p.eventType==="DELETE"){ S[c]=S[c].filter(x=>x.id!==r.id); if(DEL_RELOAD[c])accoda(DEL_RELOAD[c]); scheduleRender(); schedulePublish(); return }
     accoda([c],r.id);
   }) });
  ch=ch
   .on("postgres_changes",{event:"*",schema:"public",table:"timbrature"},p=>{
     const r=p.eventType==="DELETE"?p.old:p.new; if(!r||!r.id)return;
     const nuova=p.eventType==="INSERT"&&!T.some(x=>x.id===r.id);
     T=T.filter(x=>x.id!==r.id); if(p.eventType!=="DELETE")T.push(p.new);
     scheduleRender();
     if(nuova){const op=byId("operatori",r.operatore_id); toast(`${op?op.nome:"Un dipendente"}: ${r.tipo==="inizio"?"ha iniziato":"ha finito"} il lavoro alle ${tsHM(r.ts)}`)}
   })
   .subscribe();
}
// modifiche arrivate da un altro dispositivo: si ricaricano i record interessati, a gruppi
const coda={}; let codaT=null;
function accoda(cols,id){ cols.forEach(c=>{ const q=coda[c]=coda[c]||{tutti:false,ids:new Set()}; if(id==null)q.tutti=true; else q.ids.add(id) }); clearTimeout(codaT); codaT=setTimeout(svuotaCoda,300) }
async function svuotaCoda(){
  const job=Object.assign({},coda); for(const k of Object.keys(coda))delete coda[k];
  for(const [c,q] of Object.entries(job)){
    try{
      if(q.tutti){ const r=await caricaDB([c]); S[c]=r[c] }
      else { const ids=[...q.ids]; const r=await caricaDB([c],ids); const nuovi=r[c]||[];
        S[c]=S[c].filter(x=>!ids.includes(x.id)||nuovi.some(y=>y.id===x.id)).map(x=>nuovi.find(y=>y.id===x.id)||x);
        nuovi.forEach(y=>{ if(!S[c].some(x=>x.id===y.id))S[c].push(y) }) }
    }catch(e){ console.warn("aggiornamento",c,e) }
  }
  scheduleRender(); schedulePublish();
}
// agenda di ogni dipendente con email: da ieri ai prossimi 14 giorni
let pubT=null;
function schedulePublish(ms){ if(mode!=="db")return; clearTimeout(pubT); pubT=setTimeout(pubblicaAgende,ms||2500) }
async function pubblicaAgende(){
  if(mode!=="db")return;
  const from=addDays(today(),-1), N=16, occ=occForRange(from,N);
  const ops=S.operatori.filter(o=>o.emailApp&&o.attivo!==false);
  for(const op of ops){
    const giorni=[...Array(N)].map((_,i)=>{const d=iso(addDays(from,i)), a=assenza(op.id,d);
      const turni=occ.filter(o=>o.data===d&&o.operatori.includes(op.id)).map(o=>{const cli=byId("clienti",o.sede.clienteId);
        return {id:o.id,tipo:o.kind,sede:o.sede.nome||"",cliente:cli?cli.nome:"",indirizzo:o.sede.indirizzo||"",ora:o.ora,fine:hhmm(mins(o.ora)+o.durata*60),durata:o.durata,
          colleghi:o.operatori.filter(x=>x!==op.id).map(x=>{const c=byId("operatori",x);return c?c.nome:""}).filter(Boolean),
          nota:o.nota||"",accesso:o.sede.accesso||"",attivita:o.sede.attivita||[],annullato:o.stato==="saltato",variato:!!o.var}});
      return {data:d,assenza:a?{tipo:a.tipo,dalle:a.dalle||"",alle:a.alle||""}:null,turni}});
    const doc={operatoreId:op.id,nome:op.nome,gps:gpsOn,giorni}, js=JSON.stringify(doc);
    if(AG[op.id]===js)continue;
    const {error}=await sb.from("agenda").upsert({operatore_id:op.id,data:Object.assign({generato:new Date().toISOString()},doc)});
    if(error){console.warn("agenda",op.nome,error);continue} AG[op.id]=js;
  }
  for(const id of Object.keys(AG)) if(!ops.some(o=>o.id===id)){ const {error}=await sb.from("agenda").delete().eq("operatore_id",id); if(!error)delete AG[id] }
  if(tab==="impostazioni")render();
}
// esportazione e importazione
function esporta(){
  const dati={}; COLS.forEach(c=>dati[c]=S[c]);
  const blob=new Blob([JSON.stringify({app:"registro-pulizie",versione:1,esportato:new Date().toISOString(),dati},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="registro-pulizie-"+TODAY()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  toast("File di backup scaricato");
}
async function leggiImport(file){
  if(!file)return;
  let j; try{ j=JSON.parse(await file.text()) }catch{ toast("Il file non è un backup valido (JSON non leggibile)."); return }
  const dati=j&&j.dati?j.dati:j; const rows=[];
  COLS.forEach(c=>(Array.isArray(dati&&dati[c])?dati[c]:[]).forEach(x=>{ if(!x||!x.id)return; rows.push({col:c,id:String(x.id),data:x}) }));
  if(!rows.length){toast("Nel file non ci sono dati del gestionale.");return}
  importBuf=rows;
  const cnt={}; rows.forEach(r=>cnt[r.col]=(cnt[r.col]||0)+1);
  modalShell("Importa dati",`<div class="mb"><p class="full">Il file <b>${esc(file.name)}</b> contiene <b>${rows.length}</b> record:</p><p class="full small muted">${Object.entries(cnt).map(([k,v])=>esc(k)+" "+v).join(" · ")}</p><p class="full note">I record con lo stesso codice di quelli già presenti verranno sovrascritti. Gli altri dati restano invariati.</p><div class="err full" id="ferr"></div></div><div class="mf"><span></span><div class="actions"><button type="button" class="btn" data-close="1">Annulla</button><button type="button" class="btn primary" data-act="doImport">Importa ${rows.length} record</button></div></div>`);
  current={c:"import"};
}
async function importa(){
  const rows=importBuf||[]; if(!rows.length)return;
  const btn=$('[data-act="doImport"]'); if(btn){btn.disabled=true;btn.textContent="Importazione in corso…"}
  const D={}; rows.forEach(r=>(D[r.col]=D[r.col]||[]).push(r.data));
  let e; try{ e=await trasferisci(D,S,(n,t)=>{if(btn)btn.textContent=`Importazione: ${n} di ${t}…`}) }catch(err){ $("#ferr").textContent=erroreDB(err); if(btn){btn.disabled=false;btn.textContent="Riprova"} return }
  importBuf=null; closeAll(); await loadAll(); ver++; render(); schedulePublish(500);
  toast(`Importati ${e.fatti} record`+(e.errori.length?`, ${e.errori.length} con errori`:""));
  if(e.note.length||e.errori.length)mostraTesto("Esito dell'importazione",[...(e.errori.length?["Record non importati:",...e.errori,""]:[]),...(e.note.length?["Sistemazioni fatte:",...e.note]:[])].join("\n"));
}
async function enter(session){
  me=session.user; mode="loading"; authMsg=""; render();
  const {data:tit,error}=await sb.rpc("is_titolare");
  if(error){ mode="login"; authMsg="Il database non è pronto: hai eseguito lo script schema.sql in Supabase? ("+error.message+")"; return render() }
  if(!tit){ mode="notowner"; return render() }
  try{ let {data:imp,error:ie}=await sb.from("impostazioni").select("gps_attivo,moduli").eq("id",1).maybeSingle();
    if(ie){ ({data:imp}=await sb.from("impostazioni").select("gps_attivo").eq("id",1).maybeSingle()); moduli=[] } else moduli=(imp&&imp.moduli)||[];
    gpsOn=!!(imp&&imp.gps_attivo); await loadAll(); await loadTimb() }
  catch(e){ mode="login"; authMsg=/PGRST205|42P01/.test(e&&e.code||"")||/does not exist|Could not find the table/i.test(e&&e.message||"")?"Il database va aggiornato: in Supabase apri SQL Editor, incolla lo script supabase/schema_v2.sql del repository e premi Run. Poi ricarica questa pagina.":"Caricamento non riuscito: "+traduci(e.message); return render() }
  docsN=await contaDocs();
  const vuoto=["clienti","operatori","fornitori","fatture","movimenti","sedi","acquisti","preventivi"].every(c=>!S[c].length);
  if(vuoto&&docsN>0){ mode="migra"; migra={conteggi:null}; render(); return }
  avviaDb();
}
function avviaDb(){
  mode="db"; ver++; render(); subscribe(); schedulePublish(800); seedPagamenti(false);
  setInterval(()=>{ver++;render();schedulePublish()},15*60*1000);
}
async function boot(){
  if(!window.supabase||!CFG.url||!CFG.anonKey){ mode="login"; authMsg="Configurazione mancante: controlla il file config.js e la cartella vendor."; return render() }
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY"){recovery=true;mode="login";render()} });
  const {data:{session}}=await sb.auth.getSession();
  if(location.hash.includes("type=recovery")){recovery=true;mode="login";return render()}
  if(session&&!recovery)return enter(session);
  mode="login"; render();
}
boot();
})();
